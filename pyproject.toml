[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-sensemaking"
version = "0.1.0"
description = "Layered tools and TACC cookbooks for semantic sensemaking workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Texas Advanced Computing Center" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "httpx>=0.27",
    "tabulate>=0.9",
]

[project.optional-dependencies]
readers = ["python-docx>=1.1", "pypdf>=4.0"]
viz = ["plotly>=5.18"]
embed = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
tacc = ["semantic-sensemaking[readers,viz]"]
all = ["semantic-sensemaking[readers,viz,embed,llm]"]
dev = [
    "semantic-sensemaking[readers,viz]",
    "pytest>=8",
    "ruff>=0.5",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5.9",
    "nbmake>=1.5",
    "pre-commit>=3.5",
]

[project.scripts]
semantic-sensemaking = "semantic_sensemaking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_sensemaking = ["data/*.json", "data/schemas/*.json", "data/sample_corpus/*", "pieces/flow_lock.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live model endpoint (set SSM_TEST_BASE_URL)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B905: zips here pair sequences built to the same length.
ignore = ["E501", "B905"]
