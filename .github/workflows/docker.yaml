name: Docker image

# Pull requests build the image to catch breakage but never publish.
# Only main and version tags push to the registry, so feature branches
# don't create package versions and fork PRs don't need a write token.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the image
        run: |
          docker build -f docker/Dockerfile -t ssm-smoke .
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          cp -r src/semantic_sensemaking/data/sample_corpus "$RUNNER_TEMP/in/corpus"
          # Run as the runner's user, as Apptainer does on TACC; the image's
          # default user cannot write to a bind-mounted host directory.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e _tapisExecSystemInputDir=/in -e _tapisExecSystemOutputDir=/out \
            -v "$RUNNER_TEMP/in:/in" -v "$RUNNER_TEMP/out:/out" ssm-smoke
          test -f "$RUNNER_TEMP"/out/*/manifest.json
